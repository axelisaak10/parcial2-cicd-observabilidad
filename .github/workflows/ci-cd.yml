name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Test API and collect coverage
        run: pytest -q --cov=backend.app --cov-report=xml:backend-coverage.xml --cov-report=term-missing tests/test_api.py
      - name: Save backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests:
    name: Frontend Jest and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Jest unit tests and coverage
        run: npm run test:ci
      - name: Save frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
      - name: Build static frontend
        run: npm run build
      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  playwright-e2e:
    name: Playwright E2E suite (full stack)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    env:
      INVENTORY_ADMIN_USER: test-admin
      INVENTORY_ADMIN_PASSWORD: test-password
      INVENTORY_TOKEN_SECRET: gha-e2e-only-inventory-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python and Chromium dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
      - name: Start FastAPI and frontend
        env:
          DATABASE_PATH: /tmp/parcial2-inventory-e2e.db
        run: |
          rm -f /tmp/parcial2-inventory-e2e.db /tmp/parcial2-inventory-e2e.db-shm /tmp/parcial2-inventory-e2e.db-wal
          nohup uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/parcial2-api.log 2>&1 &
      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/parcial2-api.log
          exit 1
      - name: Run Playwright browser tests
        run: pytest -q tests/test_e2e.py
      - name: Save browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  report-tests:
    name: Report CI execution to OpenObserve
    needs: [backend-tests, frontend-tests, playwright-e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Determine aggregate test result
        id: suite
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          E2E_RESULT: ${{ needs.playwright-e2e.result }}
        run: |
          if [[ "$BACKEND_RESULT" == success && "$FRONTEND_RESULT" == success && "$E2E_RESULT" == success ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Open private OpenObserve tunnel
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_SSH_KEY" || -z "$EC2_KNOWN_HOSTS" ]]; then
            echo "EC2 secrets unavailable; the reporter will skip if OO_URL is also unavailable."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_report
          chmod 600 ~/.ssh/ec2_report
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_report -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -fN -L 5080:127.0.0.1:5080 ubuntu@"$EC2_HOST"
      - name: Send test result event
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          OO_REQUIRED: "true"
          TEST_STATUS: ${{ steps.suite.outputs.status }}
        run: python scripts/report_event.py test "${TEST_STATUS:-failure}"

  build-and-push:
    name: Build and push Docker images
    needs: [backend-tests, frontend-tests, playwright-e2e, report-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.playwright-e2e.result == 'success' && needs.report-tests.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish tagged images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f backend/Dockerfile -t "$DH_USER/parcial2-api:${GITHUB_SHA}" -t "$DH_USER/parcial2-api:latest" .
          docker build -t "$DH_USER/parcial2-frontend:${GITHUB_SHA}" -t "$DH_USER/parcial2-frontend:latest" ./frontend
          docker push "$DH_USER/parcial2-api:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-api:latest"
          docker push "$DH_USER/parcial2-frontend:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-frontend:latest"

  deploy:
    name: Deploy stack to AWS EC2
    needs: [backend-tests, frontend-tests, playwright-e2e, report-tests, build-and-push]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success' && needs.playwright-e2e.result == 'success' && needs.report-tests.result == 'success' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH access to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" 'if [ -d ~/parcial2/observability/otel-collector.yaml ]; then sudo rmdir ~/parcial2/observability/otel-collector.yaml; fi; if [ -d ~/parcial2/observability ] && [ -z "$(ls -A ~/parcial2/observability)" ]; then sudo rmdir ~/parcial2/observability; fi; mkdir -p ~/parcial2/observability ~/parcial2/scripts'
      - name: Copy deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes docker-compose.yml ubuntu@"$EC2_HOST":parcial2/
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes observability/otel-collector.yaml ubuntu@"$EC2_HOST":parcial2/observability/
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes observability/dashboard.json ubuntu@"$EC2_HOST":parcial2/observability/
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes scripts/provision_openobserve.py ubuntu@"$EC2_HOST":parcial2/scripts/
      - name: Deploy tagged images after all tests pass
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ZO_ROOT_USER_EMAIL: ${{ secrets.OO_USER }}
          ZO_ROOT_USER_PASSWORD: ${{ secrets.OO_PASSWORD }}
          INVENTORY_ADMIN_USER: ${{ secrets.INVENTORY_ADMIN_USER }}
          INVENTORY_ADMIN_PASSWORD: ${{ secrets.INVENTORY_ADMIN_PASSWORD }}
          INVENTORY_TOKEN_SECRET: ${{ secrets.INVENTORY_TOKEN_SECRET }}
        run: |
          OO_BASIC_AUTH=$(printf '%s' "$ZO_ROOT_USER_EMAIL:$ZO_ROOT_USER_PASSWORD" | base64 -w 0)
          printf 'DOCKERHUB_USERNAME=%s\nZO_ROOT_USER_EMAIL=%s\nZO_ROOT_USER_PASSWORD=%s\nOO_BASIC_AUTH=%s\nINVENTORY_ADMIN_USER=%s\nINVENTORY_ADMIN_PASSWORD=%s\nINVENTORY_TOKEN_SECRET=%s\nIMAGE_TAG=%s\n' \
            "$DOCKERHUB_USERNAME" "$ZO_ROOT_USER_EMAIL" "$ZO_ROOT_USER_PASSWORD" "$OO_BASIC_AUTH" "$INVENTORY_ADMIN_USER" "$INVENTORY_ADMIN_PASSWORD" "$INVENTORY_TOKEN_SECRET" "$IMAGE_TAG" |
            ssh -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" \
              'set -e; umask 077; cat > ~/parcial2/.env; cd ~/parcial2; sudo docker compose pull; sudo docker compose up -d --force-recreate --remove-orphans; sudo docker image prune -f; for attempt in $(seq 1 60); do code=$(curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:5080/ || true); running=$(sudo docker compose ps --status running --services | wc -l); if [[ "$code" =~ ^[234] && "$running" -eq 5 ]]; then curl --fail --silent http://127.0.0.1/health >/dev/null; set -a; source .env; set +a; if ! python3 scripts/provision_openobserve.py observability/dashboard.json; then echo "ERROR: la telemetría no quedó verificada; diagnóstico de contenedores:"; sudo docker compose ps -a; echo "=== OpenTelemetry Collector ==="; sudo docker compose logs --since 10m --tail=200 otel-collector; echo "=== Métricas del frontend ==="; sudo docker compose logs --since 10m --tail=100 frontend-metrics; echo "=== API ==="; sudo docker compose logs --since 10m --tail=100 api; exit 1; fi; echo "OpenObserve y los cinco servicios están activos; métricas y alertas verificadas"; exit 0; fi; sleep 2; done; sudo docker compose ps; exit 1'
      - name: Prepare private OpenObserve tunnel for deploy event
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_report
          chmod 600 ~/.ssh/ec2_report
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_report -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -fN -L 5080:127.0.0.1:5080 ubuntu@"$EC2_HOST"
      - name: Report deployment event to OpenObserve
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          OO_REQUIRED: "true"
        run: python scripts/report_event.py deploy "${{ job.status }}"
