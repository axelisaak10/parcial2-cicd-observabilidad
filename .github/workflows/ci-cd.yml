name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install chromium
      - name: Start application
        run: nohup uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/ci-cd-api.log 2>&1 &
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Run API and browser tests
        run: pytest -q
      - name: Prepare private OpenObserve tunnel
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_SSH_KEY" || -z "$EC2_KNOWN_HOSTS" ]]; then
            echo "EC2 secrets unavailable; skipping private OpenObserve tunnel."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_deploy -fN -L 5080:127.0.0.1:5080 ubuntu@"$EC2_HOST"
      - name: Report test result to OpenObserve
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          OO_REQUIRED: "true"
        run: python scripts/report_event.py test "${{ job.status }}"
  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -f backend/Dockerfile -t "$DH_USER/parcial2-api:${GITHUB_SHA}" -t "$DH_USER/parcial2-api:latest" .
          docker build -t "$DH_USER/parcial2-frontend:${GITHUB_SHA}" -t "$DH_USER/parcial2-frontend:latest" ./frontend
          docker push "$DH_USER/parcial2-api:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-api:latest"
          docker push "$DH_USER/parcial2-frontend:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-frontend:latest"
      - name: Configure verified SSH access to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" 'if [ -d ~/parcial2/observability/otel-collector.yaml ]; then sudo rmdir ~/parcial2/observability/otel-collector.yaml; fi; if [ -d ~/parcial2/observability ] && [ -z "$(ls -A ~/parcial2/observability)" ]; then sudo rmdir ~/parcial2/observability; fi; mkdir -p ~/parcial2/observability'
      - name: Copy deployment configuration to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes docker-compose.yml ubuntu@"$EC2_HOST":parcial2/
          scp -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes observability/otel-collector.yaml ubuntu@"$EC2_HOST":parcial2/observability/
      - name: Deploy to EC2 after passing tests
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ZO_ROOT_USER_EMAIL: ${{ secrets.OO_USER }}
          ZO_ROOT_USER_PASSWORD: ${{ secrets.OO_PASSWORD }}
        run: |
          printf 'DOCKERHUB_USERNAME=%s\nZO_ROOT_USER_EMAIL=%s\nZO_ROOT_USER_PASSWORD=%s\nIMAGE_TAG=%s\n' \
            "$DOCKERHUB_USERNAME" "$ZO_ROOT_USER_EMAIL" "$ZO_ROOT_USER_PASSWORD" "$IMAGE_TAG" |
            ssh -i ~/.ssh/ec2_deploy -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" \
              'umask 077; cat > ~/parcial2/.env; cd ~/parcial2 && sudo docker compose pull && sudo docker compose up -d --force-recreate --remove-orphans && sudo docker image prune -f && for attempt in $(seq 1 60); do code=$(curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:5080/ || true); running=$(sudo docker compose ps --status running --services | wc -l); if [[ "$code" =~ ^[234] && "$running" -eq 4 ]]; then echo "OpenObserve respondió HTTP $code; los cuatro servicios están activos"; exit 0; fi; sleep 2; done; sudo docker compose ps; exit 1'
      - name: Prepare private OpenObserve tunnel for deploy event
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_SSH_KEY" || -z "$EC2_KNOWN_HOSTS" ]]; then
            echo "EC2 secrets unavailable; skipping private OpenObserve tunnel."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy
          chmod 600 ~/.ssh/ec2_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_deploy -fN -L 5080:127.0.0.1:5080 ubuntu@"$EC2_HOST"
      - name: Report deployment to OpenObserve
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
          OO_REQUIRED: "true"
        run: python scripts/report_event.py deploy "${{ job.status }}"
