name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Start application
        run: nohup uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/ci-cd-api.log 2>&1 &
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Run API and browser tests
        run: pytest -q
      - name: Report test result to OpenObserve
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
        run: python scripts/report_event.py test "${{ job.status }}"
  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$DH_USER/parcial2-api:${GITHUB_SHA}" -t "$DH_USER/parcial2-api:latest" ./backend
          docker build -t "$DH_USER/parcial2-frontend:${GITHUB_SHA}" -t "$DH_USER/parcial2-frontend:latest" ./frontend
          docker push "$DH_USER/parcial2-api:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-api:latest"
          docker push "$DH_USER/parcial2-frontend:${GITHUB_SHA}"
          docker push "$DH_USER/parcial2-frontend:latest"
      - name: Copy deployment configuration to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,observability/otel-collector.yaml"
          target: "~/parcial2"
      - name: Deploy to EC2 after passing tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/parcial2
            export IMAGE_TAG=${{ github.sha }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
      - name: Report deployment to OpenObserve
        if: always()
        env:
          OO_URL: ${{ secrets.OO_URL }}
          OO_USER: ${{ secrets.OO_USER }}
          OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
        run: python scripts/report_event.py deploy "${{ job.status }}"
