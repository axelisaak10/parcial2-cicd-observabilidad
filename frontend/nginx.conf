server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /nginx_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
  }
  location /api/ { proxy_pass http://api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /health { proxy_pass http://api:8000/health; }
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
