services:
  api:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/parcial2-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_PATH: /data/inventory.db
      INVENTORY_ADMIN_USER: ${INVENTORY_ADMIN_USER:?Define INVENTORY_ADMIN_USER en .env}
      INVENTORY_ADMIN_PASSWORD: ${INVENTORY_ADMIN_PASSWORD:?Define INVENTORY_ADMIN_PASSWORD en .env}
      INVENTORY_TOKEN_SECRET: ${INVENTORY_TOKEN_SECRET:?Define INVENTORY_TOKEN_SECRET en .env}
      OTEL_SERVICE_NAME: ci-cd-demo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
      OTEL_METRIC_EXPORT_INTERVAL_MS: 15000
    depends_on: [otel-collector]
    volumes: [inventory-data:/data]
    restart: unless-stopped
  frontend:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME en .env}/parcial2-frontend:${IMAGE_TAG:-latest}
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped
  frontend-metrics:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://frontend/nginx_status"]
    restart: unless-stopped
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.7
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Define ZO_ROOT_USER_EMAIL en .env}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Define ZO_ROOT_USER_PASSWORD en .env}
      ZO_DATA_DIR: /data
    volumes: ["openobserve-data:/data"]
    ports: ["5080:5080"]
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - otelcol-data:/var/lib/otelcol
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ROOT: /hostfs
      OO_BASIC_AUTH: ${OO_BASIC_AUTH:?Define OO_BASIC_AUTH en .env}
    depends_on: [openobserve]
    restart: unless-stopped
volumes:
  openobserve-data:
  inventory-data:
  otelcol-data:
